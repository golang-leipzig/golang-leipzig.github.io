<meta name='impact-site-verification' value='54840aba-1503-416b-b5d7-dafee41af763'> <!-- O'Reilly Media -->

<style>
    /* Tables: sans-serif, a bit smaller, zebra stripes; wide tables scroll
       horizontally instead of overflowing the 45em column. */
    table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow-x: auto;
        margin: 1.5em 0;
        border-collapse: collapse;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 0.8em;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
    }

    th, td {
        padding: 0.45em 0.8em;
        text-align: left;
        vertical-align: top;
    }

    thead th {
        border-bottom: 2px solid #2f2d2e;
        font-weight: 600;
    }

    tbody tr {
        border-bottom: 1px solid #e4e4e4;
    }

    tbody tr:nth-child(even) {
        background: #f5f5f5;
    }

    tbody tr:last-child {
        border-bottom: 1px solid #2f2d2e;
    }

    /* the theme gives links a white bottom border, visible on gray rows */
    table a {
        border-bottom-color: transparent;
    }

    /* Heading anchors: a dimmed "#" that only appears while the pointer is on
       the heading, or when the link has keyboard focus. Opacity, not
       visibility, so the link stays reachable with the tab key. */
    a.anchor {
        padding-right: 0;
        border-bottom-color: transparent;
        font-weight: normal;
        opacity: 0;
        transition: opacity 150ms ease-in;
    }

    h1:hover a.anchor,
    h2:hover a.anchor,
    a.anchor:focus {
        opacity: 1;
    }

    a.anchor:hover {
        border-bottom-color: transparent;
        color: #838383;
    }
</style>

<!--
        For CLT2023: https://chemnitzer.linux-tage.de/2023/en/programm/beitrag/234

        > Sustainability and Security in the Go ecosystem

        When the go command downloads a module in direct mode, it first looks up
        the module server’s URL with an HTTP GET request based on the module path.
        It looks for a <meta> tag with the name go-import in the HTML response. The
        tag’s content must contain the repository root path, the version control
        system, and the URL, separated by spaces. See Finding a repository for a
        module path for details.

        -- https://go.dev/ref/mod#serving-from-proxy
    -->
<meta name="go-import" content="golangleipzig.space/clt23 git https://github.com/golang-leipzig/clt23">
